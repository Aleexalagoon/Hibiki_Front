name: HIBIKI MUSIC FRONTEND CI/CD

on:
  push:
    branches: [ "home" ]
  pull_request:
    branches: [ "home" ]

env:
  EKS_CLUSTER_NAME: demo-cluster
  AWS_REGION: us-east-1
  IMAGE_NAME: alejandroalagon33/tfg
  IMAGE_TAG: hibikifront-hibiki-complete-v1.2

jobs:
  build:
    name: Build and Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Frontend to Docker Hub
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kube config
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Deploy Frontend to EKS
        run: kubectl apply -f deployment-front.yaml

      - name: Verify Frontend Deployment
        run: |
          kubectl rollout status deployment/front-deploy
          kubectl get services hibiki-frontend-service
